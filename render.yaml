# Render blueprint — https://render.com
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    # NOTE: this name becomes the permanent *.onrender.com subdomain and Render
    # does NOT allow renaming it after creation. Pick carefully.
    name: shopee-clone-vn
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
